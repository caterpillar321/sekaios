# SekaiOS — NetworkManager 기본 설정
[main]
# DNS 는 systemd-resolved 에 위임 (이미 시스템에 있음)
dns=systemd-resolved
# 모든 장치를 NM 이 관리 (netplan/ifupdown 을 쓰지 않으므로)
plugins=keyfile

[keyfile]
unmanaged-devices=none

[device]
# 유선은 연결되면 자동 접속
wifi.scan-rand-mac-address=yes

[connection]
# 랜덤 MAC — 공용 와이파이에서 추적 방지
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=permanent
