# SekaiOS 부팅 메뉴 (GRUB) 설정 — 바꾼 뒤 `sudo update-grub`
#   커널 옵션은 /etc/default/sekai-boot 의 SEKAI_KERNEL_OPTS
GRUB_DISTRIBUTOR="SekaiOS"
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_THEME=/usr/share/grub/themes/sekai/theme.txt
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_TERMINAL_OUTPUT=gfxterm
# 다른 디스크의 Windows 등을 찾아 메뉴에 넣는다 (os-prober)
GRUB_DISABLE_OS_PROBER=false
GRUB_DISABLE_RECOVERY=true
