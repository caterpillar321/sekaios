# SekaiOS 세션의 포털 (XDG_CURRENT_DESKTOP=SekaiOS:Hyprland — xdg-desktop-portal 이 이 파일을 먼저 찾는다)
#   기본은 GTK (파일 고르기·색 모드 등), 화면을 찍거나 나누는 것은 wlroots 포털 (Hyprland 가 쓰는 화면 복사 규약을 안다),
#   앱의 비밀 저장(플랫팩 등)은 gnome-keyring.
#   (Hyprland 패키지의 hyprland-portals.conf 는 xdg-desktop-portal-hyprland 를 먼저 찾는데 데비안에 없다 —
#    그래서 예전엔 화면 공유 포털이 없었다)
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
