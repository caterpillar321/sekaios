# SekaiOS 기본 화면 모드(X11) 세션의 포털 — XDG_CONFIG_DIRS 맨 앞(/usr/share/sekai/x11-xdg)이라
#   /usr/share/xdg-desktop-portal/sekaios-portals.conf(Hyprland 세션용)보다 먼저 읽힌다.
#   화면 찍기·나누기를 wlr 포털로 정해 두면 X11 에선 그 서비스가 조건(WAYLAND_DISPLAY) 때문에 안 뜨는데,
#   포털이 25초씩 두 번 기다리느라 로그인 뒤 50초 동안 포털을 묻는 앱(설정 등)이 열리지 않았다 (2026-10-05 메인 PC)
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
