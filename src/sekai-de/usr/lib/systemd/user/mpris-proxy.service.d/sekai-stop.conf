# 끌 때 90초 멈춤 (메인 PC 2026-10-15·10-22) — bluez 5.82 mpris-proxy 의 SIGTERM 처리기가 g_main_loop_quit 을 부른다.
#   신호 안에서 부르면 안 되는 함수라, 종료 때처럼 D-Bus 일(org.bluez 사라짐·플레이어 사라짐)을 처리하는 도중에 신호가 오면
#   GMainContext 잠금을 다시 잡으려다 스스로 멈춘다 → systemd 기본 90초 뒤 SIGKILL. 평소 멈추는 데 5ms 라 3초면 넉넉하다.
#   지킬 상태가 없는 중계기라 강제로 끝나도 잃는 것이 없다
[Service]
TimeoutStopSec=3s
