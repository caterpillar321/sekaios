# SekaiOS — greetd 설정
#   /etc/greetd/config.toml 은 greetd 패키지 것이라 두고, 서비스가 이 파일을 쓰게 한다
#   (/usr/lib/systemd/system/greetd.service.d/sekai.conf).
[terminal]
# 로그인 화면은 1번 가상 터미널 — 부팅 화면(Plymouth)과 같은 곳이라 넘어갈 때 콘솔이 끼어들지 않는다
#   (GDM 과 같다). 비상용 텍스트 콘솔은 Ctrl+Alt+F2~F6.
vt = 1

[default_session]
command = "/usr/bin/sekai-greeter-session"
user = "_greetd"
