# SekaiOS — 앱 실행기 (Super+D)
[main]
font=Pretendard:size=12
prompt="  "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=sekai-terminal -e
layer=overlay
width=36
lines=9
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=30
letter-spacing=0

[colors]
background=1e1e22e6
text=b8b8c0ff
prompt=39c5bbff
placeholder=8a8a94ff
input=f1f1f3ff
match=39c5bbff
selection=333339ff
selection-text=f1f1f3ff
selection-match=5fd6ceff
border=ffffff1a

[border]
width=1
radius=12
