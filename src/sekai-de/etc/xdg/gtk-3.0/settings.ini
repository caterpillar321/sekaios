# SekaiOS — GSettings 를 못 읽는 경우의 대비책
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Sekai-Dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Pretendard 10
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-cursor-theme-name=Sekai-Cursor-White
gtk-cursor-theme-size=24
gtk-decoration-layout=:minimize,maximize,close
# 선택 가능한 라벨이 초점을 받아도 글 전체를 선택하지 않는다 — 창이 뜰 때 첫 초점이 라벨에 가면 안내 글이
#   드래그한 것처럼 강조돼 보였다(방화벽 허용 창). 윈도우도 라벨에 초점이 와도 선택하지 않는다
gtk-label-select-on-focus=0
