<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SekaiOS — 기본 산세리프(sans-serif)를 화면 글꼴(Pretendard)로.
     GTK 앱은 Pretendard 를 쓰는데 "sans-serif"만 적은 앱·웹 페이지는 영문 DejaVu Sans + 한글 NanumGothic 으로 떠서
     앱마다 글자 모양·굵기가 달랐다. Pretendard 에 없는 글자는 그대로 DejaVu·Nanum 등으로 이어진다.
     (60-latin.conf 의 기본 목록보다 먼저 와야 해서 45) -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Pretendard</family>
    </prefer>
  </alias>
</fontconfig>
