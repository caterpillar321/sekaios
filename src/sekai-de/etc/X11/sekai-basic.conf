# SekaiOS 기본 화면 모드 — 펌웨어가 켜 둔 화면(/dev/fb0, EFI 프레임버퍼)에 그대로 그린다.
#   /usr/lib/sekai/x11/start 가 "Xorg -config sekai-basic.conf" 로 쓴다.
#   Xorg 가 스스로 고르게 두면, 드라이버 없는 NVIDIA(모니터 연결) 옆에 드라이버 있는
#   내장 GPU(모니터 없음)가 있을 때 내장 GPU 쪽을 잡아 화면이 까맣게 된다.
Section "Device"
    Identifier "firmware-fb"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection
