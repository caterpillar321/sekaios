# SekaiOS 로그인 화면용 Hyprland — 로그인 화면 하나만 띄운다
monitor = , preferred, auto, 1
env = XCURSOR_SIZE,24

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_hyprland_qtutils_check = true
    background_color = rgb(151517)
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
input {
    kb_layout = us
    kb_options = korean:ralt_hangul,korean:rctrl_hanja
}
animations {
    enabled = true
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    animation = layersIn,   1, 5, smooth, fade
    animation = fadeLayers, 1, 5, smooth
}
debug {
    disable_logs = false
}

# 로그인 화면이 끝나면(로그인 성공) 이 Hyprland 도 닫는다
exec-once = sh -c 'sekai-greeter; hyprctl dispatch exit'
