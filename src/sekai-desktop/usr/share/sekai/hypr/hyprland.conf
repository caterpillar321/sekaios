# ═══════════════════════════════════════════════════════════
#  SekaiOS 1.0 (Hatsune) — Hyprland 기본 설정
#
#  이 파일은 sekai-desktop 패키지가 관리한다.
#  업데이트하면 덮어써지므로 여기를 직접 고치지 말 것.
#
#  바꾸고 싶은 건 ~/.config/hypr/hyprland.conf 에 쓰면 된다.
#  그 파일이 이 파일을 source 한 뒤에 읽히므로 거기 값이 이긴다.
#
#  문서: https://wiki.hyprland.org/
# ═══════════════════════════════════════════════════════════

$mainMod = SUPER
$term    = sekai-terminal
$menu    = fuzzel

# ── 모니터 ─────────────────────────────────────────────
monitor = , preferred, auto, 1

# ── 시작 시 실행 ───────────────────────────────────────
# 세션 환경을 D-Bus 로 켜지는 서비스(파일 대화상자 포털 등)에도 알린다.
#   안 하면 그쪽은 영어로, 혹은 Wayland 를 못 찾고 뜬다.
# 세션이 떴다는 표시 — sekai-session 이 빠른 로그아웃을 드라이버 고장으로 오해하지 않게
exec-once = touch "$XDG_RUNTIME_DIR/sekai-session.up"
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE LANG LANGUAGE XMODIFIERS QT_IM_MODULES XDG_CONFIG_DIRS XDG_DATA_DIRS
# 한글 입력기 — ibus 를 Wayland 입력기 모드로
exec-once = ibus start --type wayland
# 바탕화면 — 배경화면과 바탕화면 아이콘을 함께 그린다 (죽으면 다시 띄운다, 로그아웃하면 멈춤)
exec-once = /usr/lib/sekai/keep-running sekai-desk
# 작업 표시줄 — 비정상 종료되면 1초 뒤 다시 띄운다 (없으면 작업 표시줄 없이 갇힌다)
exec-once = /usr/lib/sekai/keep-running sekai-panel
# 알림 데몬은 sekai-panel 이 직접 구현한다 (알림 센터가 있어야 해서).
# 외부 데몬을 띄우면 org.freedesktop.Notifications 이름을 뺏겨 버린다.
# 관리자 권한 확인(사용자 계정 컨트롤) · 네트워크 암호 창 — 죽으면 다시 띄운다
exec-once = /usr/lib/sekai/keep-running /usr/lib/sekai/polkit-agent
exec-once = /usr/lib/sekai/keep-running /usr/lib/sekai/nm-agent
# 이동식 드라이브 자동 연결 (꽂으면 연결하고 "폴더 열기" 알림) — 이미 떠 있으면 조용히 끝난다
exec-once = /usr/lib/sekai/keep-running /usr/lib/sekai/automount
exec-once = wl-paste --watch cliphist store
# 자리 비움 — 설정의 "전원 및 잠금" 시간대로 화면 끄기·잠금·절전
exec-once = sekai-idle
# 그래픽 가속이 없어 CPU 렌더링으로 뜬 경우 (hw-env.sh 가 SEKAI_SOFTWARE_RENDER=1)
#   흐림·그림자·애니메이션을 꺼서 가볍게 하고, 드라이버를 설치하라고 알린다
exec-once = sh -c '[ -n "$SEKAI_SOFTWARE_RENDER" ] || exit 0; hyprctl --batch "keyword decoration:blur:enabled false; keyword decoration:shadow:enabled false; keyword animations:enabled false" >/dev/null; sleep 6; notify-send -a 디스플레이 -i video-display "기본 그래픽 모드로 실행 중입니다" "그래픽 가속을 쓸 수 없어 CPU 로 화면을 그리고 있습니다. 그래픽 드라이버를 설치하면 빨라집니다."'
# 설치 USB 로 켰으면 설치 화면을 띄운다 (설치된 시스템에서는 조용히 끝난다)
exec-once = sh -c 'sleep 2; command -v sekai-installer >/dev/null && sekai-installer --autostart'
# 자동 시작 앱 (~/.config/autostart, /etc/xdg/autostart — 작업 관리자 › 시작 앱에서 켜고 끈다).
#   위에서 직접 띄운 것(ibus)은 건너뛰고, 다른 DE 의 것(nm-applet·lxpolkit 등)은 띄우지 않는다
#   (sekaishell/autostart.py 의 MANAGED·NEVER)
exec-once = sh -c 'sleep 2; exec /usr/lib/sekai/autostart'

# ── 환경변수 ───────────────────────────────────────────
# 마우스 커서 — DMZ-White (dmz-cursor-theme). 크기는 설정 앱이 ~/.config/hypr/sekai.conf 에서 바꾼다
env = XCURSOR_THEME,DMZ-White
env = XCURSOR_SIZE,24
# SekaiOS 기본 설정 계층 — /etc/xdg/sekai 를 /etc/xdg 보다 먼저 본다.
#   foot·fuzzel 은 자기 패키지가 /etc/xdg 에 설정 파일을 갖고 있어서 덮어쓸 수 없다.
#   이렇게 앞에 한 층을 두면 우리 기본값이 이기고, 사용자 ~/.config 는 여전히 그 위에서 이긴다.
env = XDG_CONFIG_DIRS,/etc/xdg/sekai:/etc/xdg
# 같은 방식으로 데이터도 한 층 — 실행기에서 숨길 .desktop 재정의 등
env = XDG_DATA_DIRS,/usr/share/sekai/data:/usr/local/share:/usr/share
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
# GPU 가속이 없는 가상머신에서 화면이 안 뜨면 아래 주석을 해제:
# env = LIBGL_ALWAYS_SOFTWARE,1

# ── 입력 ───────────────────────────────────────────────
input {
    kb_layout = us
    kb_options = korean:ralt_hangul,korean:rctrl_hanja
    follow_mouse = 2           # 윈도우처럼: 클릭해야 초점이 옮겨간다 (휠은 마우스 밑 창으로)
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

cursor {
    no_warps = true            # 윈도우처럼: 창을 골라도(작업 표시줄·Alt+Tab) 커서는 제자리
}

# ── 외관 ───────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 0        # 최대화한 창이 화면에 꽉 차게 (윈도우처럼)
    border_size = 1
    # 단색 — 그라데이션/회전 효과는 과해서 뺐다. 타이틀바가 있으니 테두리는 최소로.
    col.active_border = rgba(39c5bb99)
    col.inactive_border = rgba(ffffff14)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false

    # 창을 끌 때 화면 가장자리·다른 창에 착 붙는다
    snap {
        enabled = true
        window_gap = 12
        monitor_gap = 14
    }
}

decoration {
    rounding = 10
    active_opacity = 1.0
    # 비활성 창을 반투명하게 하면 글자가 뿌옇게 보여 읽기 나쁘다
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(0000006b)
        offset = 0 6
    }
}

# ── 애니메이션 (여기가 Hyprland 를 고른 이유) ──────────
animations {
    enabled = true

    bezier = sekaiOut,  0.05, 0.9,  0.1,  1.02
    bezier = sekaiIn,   0.36, 0.0,  0.66, -0.4
    bezier = smooth,    0.25, 0.1,  0.25, 1.0

    animation = windows,     1, 4, sekaiOut, slide
    animation = windowsOut,  1, 3, sekaiIn,  popin 85%
    animation = border,      1, 6, smooth
    animation = fade,        1, 5, smooth
    animation = workspaces,  1, 4, sekaiOut, slidevert
    animation = layersIn,    1, 3, sekaiOut, popin 94%
    animation = layersOut,   1, 2, smooth,   popin 96%
    animation = fadeLayers,  1, 3, smooth
}

# ── 레이아웃 ───────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    # 기본 배경화면을 제거했으므로 반드시 꺼야 함
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # hyprland-qtutils 는 데비안에 없다. 없다는 경고만 끈다.
    disable_hyprland_qtutils_check = true
    # 데스크톱 이름은 SekaiOS:Hyprland (sekai-session) — "Hyprland" 가 아니라는 경고를 끈다
    disable_xdg_env_checks = true
    background_color = rgb(000000)   # 바탕화면이 뜨기 전 빈 화면 — 검정 (부팅 화면·로그인 화면과 넘어갈 때 한결같이)
    # 잠금 화면(sekai-lock)이 죽었을 때 다시 띄워 잠금을 이어받을 수 있게
    #   (잠금은 풀리지 않는다 — 컴포지터가 화면을 잠근 채로 둔다)
    allow_session_lock_restore = true
    vfr = true
}

# ── 키 바인딩 (윈도우와 같은 자리에) ─────────────────────
#   셸 기능은 sekai-ctl 이 작업 표시줄(org.sekai.Shell)에 부탁한다.
#   설정 › 단축키 가 이 줄들을 읽어 목록을 만든다 (sekaishell/keybinds.py):
#     · bindd 의 설명이 화면에 보이는 이름 — 쉼표는 못 쓴다 (Hyprland 가 인자 구분으로 읽는다)
#     · "#: 이름" 줄이 그 아래 단축키들의 묶음
#     · 사용자가 바꾼 키는 여기 적힌 기본 키 조합(예: SUPER+E)을 이름 삼아 기억한다.
#       기본 키를 바꾸면 그 항목의 사용자 설정은 버려진다.
#   바꾼 키는 ~/.config/hypr/sekai.conf 가 이 파일 다음에 unbind + bind 로 덮는다.

#: 시작 메뉴 및 시스템
bindrd = $mainMod, SUPER_L, 시작 메뉴, exec, sekai-ctl menu     # Win 키만 눌렀다 떼면
bindd = CTRL, Escape,      시작 메뉴, exec, sekai-ctl menu     # 윈도우와 같은 키 (기본 화면 모드의 Win 키도 이것)
bindd = $mainMod, N,       알림 센터, exec, sekai-ctl notifications
bindd = $mainMod, A,       빠른 설정, exec, sekai-ctl quicksettings   # 윈도우 11 과 같게
bindd = $mainMod, V,       클립보드 기록, exec, sekai-ctl clipboard
bindd = $mainMod, I,       설정, exec, sekai-settings
bindd = CTRL SHIFT, Escape, 작업 관리자, exec, sekai-taskmgr
bindd = $mainMod, L,       화면 잠금, exec, /usr/libexec/sekai/lock-now   # 실패하면 swaylock, 잠금 화면이 죽으면 다시
bindd = $mainMod SHIFT, M, 로그아웃, exit,                     # 실수로 누르지 않게 Shift 까지

#: 앱 실행
bindd = $mainMod, E,       파일 탐색기, exec, sekai-files
bindd = $mainMod, Return,  터미널, exec, $term
bindd = $mainMod, R,       실행, exec, $menu
bindd = $mainMod, D,       앱 찾기, exec, $menu

#: 창
bindd = $mainMod, Q,       창 닫기, killactive,
bindd = ALT, F4,           창 닫기, killactive,
# Alt+Tab — 창 전환기. Alt 를 떼면 고른 창으로 (전환기가 직접 받는다)
bindd = ALT, Tab,          창 전환, exec, sekai-ctl switch next
bindd = ALT SHIFT, Tab,    창 전환 (거꾸로), exec, sekai-ctl switch prev
# 창 배치 — Win+←/→ 반쪽, Win+↑ 최대화, Win+↓ 복원·최소화
bindd = $mainMod, left,    창을 왼쪽 절반에, exec, sekai-ctl snap left
bindd = $mainMod, right,   창을 오른쪽 절반에, exec, sekai-ctl snap right
bindd = $mainMod, up,      창 최대화, exec, sekai-ctl snap up
bindd = $mainMod, down,    창 복원 · 최소화, exec, sekai-ctl snap down
bindd = $mainMod SHIFT, left,  창을 왼쪽 모니터로, movewindow, mon:l
bindd = $mainMod SHIFT, right, 창을 오른쪽 모니터로, movewindow, mon:r
bindd = $mainMod, F,       전체 화면, fullscreen, 0
bindd = , F11,             전체 화면, fullscreen, 0
bindd = $mainMod SHIFT, V, 이 창만 타일링 ↔ 자유 배치, togglefloating,
bindd = $mainMod, J,       타일 나누는 방향 바꾸기, togglesplit,

#: 가상 데스크톱
#   데스크톱 = 워크스페이스 1…N. 개수·이름은 설정 › 멀티태스킹 (sekaishell/desktops.py).
#   sekai-ctl 을 거쳐야 이름을 화면 가운데에 보여 주고, 없는 번호로 가면 데스크톱을 만든다.
# 작업 보기 — hyprexpo 의 디스패처는 플러그인을 늦게 올려서(아래) 설정을 읽을 때는 아직 없다.
#   그대로 bind 하면 오류가 나고, 나중에 hyprctl keyword 로 걸면 설정을 다시 읽을 때(reload) 사라진다
#   → exec 로 hyprctl dispatch 를 부른다.
bindd = $mainMod, Tab,         작업 보기, exec, hyprctl dispatch hyprexpo:expo toggle
bindd = $mainMod CTRL, D,      새 데스크톱 만들기, exec, sekai-ctl desktop new
bindd = $mainMod CTRL, F4,     지금 데스크톱 닫기, exec, sekai-ctl desktop close
bindd = $mainMod CTRL, left,   왼쪽 데스크톱으로, exec, sekai-ctl desktop prev
bindd = $mainMod CTRL, right,  오른쪽 데스크톱으로, exec, sekai-ctl desktop next
bindd = $mainMod, 1, 데스크톱 1로, exec, sekai-ctl desktop go 1
bindd = $mainMod, 2, 데스크톱 2로, exec, sekai-ctl desktop go 2
bindd = $mainMod, 3, 데스크톱 3으로, exec, sekai-ctl desktop go 3
bindd = $mainMod, 4, 데스크톱 4로, exec, sekai-ctl desktop go 4
bindd = $mainMod, 5, 데스크톱 5로, exec, sekai-ctl desktop go 5
bindd = $mainMod SHIFT, 1, 창을 데스크톱 1로, exec, sekai-ctl desktop move 1
bindd = $mainMod SHIFT, 2, 창을 데스크톱 2로, exec, sekai-ctl desktop move 2
bindd = $mainMod SHIFT, 3, 창을 데스크톱 3으로, exec, sekai-ctl desktop move 3
bindd = $mainMod SHIFT, 4, 창을 데스크톱 4로, exec, sekai-ctl desktop move 4
bindd = $mainMod SHIFT, 5, 창을 데스크톱 5로, exec, sekai-ctl desktop move 5
bindd = $mainMod, mouse_down,  다음 데스크톱, exec, sekai-ctl desktop next
bindd = $mainMod, mouse_up,    이전 데스크톱, exec, sekai-ctl desktop prev

#: 스크린샷
#   사진/스크린샷 폴더에 저장 + 클립보드
bindd = , Print,           화면 전체 캡처, exec, sekai-screenshot
bindd = SHIFT, Print,      영역 캡처, exec, sekai-screenshot region
bindd = $mainMod SHIFT, S, 영역 캡처, exec, sekai-screenshot region
bindd = ALT, Print,        창 캡처, exec, sekai-screenshot window

#: 소리 및 밝기
#   화면에 잠깐 표시 — 누르고 있으면 반복(e), 잠금 화면에서도 동작(l)
bindeld = , XF86AudioRaiseVolume,  볼륨 크게, exec, sekai-ctl volume up
bindeld = , XF86AudioLowerVolume,  볼륨 작게, exec, sekai-ctl volume down
bindld  = , XF86AudioMute,         음소거, exec, sekai-ctl volume mute
bindld  = , XF86AudioMicMute,      마이크 끄기, exec, sekai-ctl volume mic-mute
bindeld = , XF86MonBrightnessUp,   화면 밝게, exec, sekai-ctl brightness up
bindeld = , XF86MonBrightnessDown, 화면 어둡게, exec, sekai-ctl brightness down

#: 미디어
#   재생 중인 플레이어(브라우저·음악 앱)에
bindld = , XF86AudioPlay,  재생 · 일시 정지, exec, playerctl play-pause
bindld = , XF86AudioPause, 재생 · 일시 정지, exec, playerctl play-pause
bindld = , XF86AudioNext,  다음 곡, exec, playerctl next
bindld = , XF86AudioPrev,  이전 곡, exec, playerctl previous
bindld = , XF86AudioStop,  정지, exec, playerctl stop

#: 마우스
bindmd = $mainMod, mouse:272, 창 옮기기, movewindow
bindmd = $mainMod, mouse:273, 창 크기 바꾸기, resizewindow

# 설정 › 단축키 가 새 키를 받는 동안 이 submap 으로 — 여기엔 단축키가 없어 누른 키가 모두 설정 창으로 간다.
#   Esc 를 떼면 원래대로 돌아온다 (설정 창이 죽어 갇혀도 Esc 로 빠져나온다).
#   r(뗄 때) + n: 누르는 것은 설정 창에 그대로 가서 창을 닫는다 — submap 디스패처는 n 이어도
#   그 키를 삼키므로, 누를 때 걸면 설정 창이 Esc 를 못 받는다 (KeybindManager.cpp)
submap = sekai-capture
bindrn = , Escape, submap, reset
submap = reset

# ── 창 배치: 윈도우 스타일 (타일링 대신 자유 배치) ─────
#   Hyprland 는 기본이 동적 타일링이라 창이 화면을 자동 분할한다.
#   float 규칙을 주면 창이 겹치고 자유롭게 움직이는 방식이 된다.
#   개별 창을 타일링으로 되돌리려면 Super+Shift+V
windowrulev2 = float, class:.*
windowrulev2 = center, floating:1
# 크기를 지정하지 않은 창의 기본 크기
windowrulev2 = size 950 620, floating:1, class:^(foot|kitty)$

# 제 제목줄(헤더바·탭 줄)을 직접 그리는 앱은 타이틀바가 두 줄이 된다 → 우리 막대를 뺀다
#   크로미움/크롬: 탭 줄에 자체 최소화·최대화·닫기가 있다 (윈도우의 크롬과 같은 모양)
#   GNOME 앱(org.gnome.*): GtkHeaderBar 를 쓴다
# ── 셸 표면 흐림 (윈도우 11 의 Mica/Acrylic 느낌) ──────────
#   sekai-panel 이 레이어마다 이름표(namespace)를 붙인다.
#   ignorealpha: 둥근 모서리 바깥의 투명 픽셀까지 흐리면 사각형 테두리가 비친다.
layerrule = blur, ^(sekai-panel|sekai-menu|sekai-popup|sekai-toast|sekai-switcher|sekai-osd|sekai-snap|launcher)$
layerrule = ignorealpha 0.4, ^(sekai-panel|sekai-menu|sekai-popup|sekai-toast|sekai-switcher|sekai-osd|launcher)$
# 끌어서 스냅 미리보기 — 부드럽게 나타나고 사라지게
layerrule = animation fade, ^(sekai-snap)$
# 위쪽 가운데로 창을 끌면 레이아웃 바가 위에서 내려온다
layerrule = animation slide top, ^(sekai-snapbar)$
layerrule = blur, ^(sekai-snapbar)$
layerrule = ignorealpha 0.4, ^(sekai-snapbar)$
layerrule = noanim, ^(sekai-catcher|sekai-desk)$
# 사용자 계정 컨트롤: 어두운 막은 서서히, 카드는 살짝 커지며. 흐림은 넣지 않는다 (카드 둘레 투명 그림자 자리가 사각형으로 흐려진다).
#   order 는 주지 않는다 — 클수록 뒤에 그려져 막이 카드를 덮었다. 만든 순서(막 → 카드)로 이미 맞게 쌓인다
layerrule = animation fade, ^(sekai-uac-dim)$
layerrule = animation popin 90%, ^(sekai-uac|sekai-netauth|sekai-keyring)$

windowrulev2 = plugin:hyprbars:nobar, class:^(chromium|google-chrome.*|org\.gnome\..*)$
# 파일 탐색기는 탭이 든 제목 표시줄을 스스로 그린다 (윈도우 11) — 본창만. 본창(GTK 가 제목 표시줄을 그리는 창)은
#   처음 제목이 앱 이름(org.sekaios.Files)으로 오고, 같은 앱의 대화상자(속성·파일 바꾸기 …)는 자기 제목으로 와서
#   hyprbars 제목 표시줄을 그대로 쓴다
windowrulev2 = plugin:hyprbars:nobar, class:^(org\.sekaios\.Files)$, initialTitle:^(org\.sekaios\.Files)$

# 테두리를 조금 두껍게 (타이틀바가 없으므로 경계가 보이게)

# ── 타이틀바 (hyprbars 플러그인) ────────────────────────
# 플러그인 로드 권한을 명시적으로 허용
permission = /usr/lib/x86_64-linux-gnu/.*\.so, plugin, allow

# ── 색 관리(HDR) 프로토콜 끄기 ─────────────────────────
#   Hyprland 0.50 의 구현은 일부만 되어 있어, 크로미움(153)이 보내는 "직접 정한 원색" 요청을
#   프로토콜 오류로 거부하고 크로미움 연결을 끊는다 (창이 안 열림). SekaiOS 는 아직 HDR 을
#   다루지 않으므로 꺼 둔다. (Hyprland 를 다시 시작해야, 즉 다시 로그인해야 적용된다)
render {
    cm_enabled = false
}

plugin {
    hyprbars {
        # GTK 다크 테마 앱의 본문색(#2d2d2d)에 맞춘다 — 제목줄과 창 본문이 한 몸으로 보이게
        bar_height = 34
        bar_color = rgb(2c2c30)
        col.text = rgb(e6e6ea)
        bar_text_size = 10
        bar_text_font = Pretendard SemiBold
        bar_text_align = left
        bar_padding = 14
        bar_button_padding = 22
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_buttons_alignment = right
        on_double_click = hyprctl dispatch fullscreen 1

        # 창 조작 버튼(최소화·최대화·닫기)은 ~/.config/hypr/sekai.conf 에서 만든다 —
        #   색이 다크/라이트 모드를 따라야 해서 (설정 앱의 store.py write_hypr_fragment)
    }
}

# ── 작업 보기 (hyprexpo 플러그인) ───────────────────────
#   윈도우의 Win+Tab 에 해당. 워크스페이스를 격자로 펼쳐서 보여준다.
plugin {
    hyprexpo {
        columns = 3
        gap_size = 6
        bg_col = rgb(0a0e16)
        workspace_method = center current
        skip_empty = true
        enable_gesture = true
        gesture_fingers = 4
    }
}

# ── 플러그인 로드 ───────────────────────────────────────
#   주의: config 의 `plugin = ...so` 로 부팅 시 로드하면 안 된다.
#   Hyprland 는 PluginSystem 을 DecorationPositioner 보다 먼저 만들기 때문에,
#   그렇게 로드된 hyprbars 의 openWindow 훅이 DecorationPositioner 것보다
#   먼저 호출된다 → getWindowDecorationReserved() 가 std::out_of_range 를
#   던지고 Hyprland 는 이를 플러그인 크래시로 간주해 hyprbars 를 언로드한다.
#   (증상: plugin list 에는 보이는데 타이틀바가 안 나옴)
#   컴포지터가 완전히 올라온 뒤 hyprctl 로 로드하면 순서가 올바르다.
#
#   hyprexpo 의 findFunctionsByName() 은 내부적으로 `nm -D` 를 실행하므로
#   binutils 패키지가 반드시 설치돼 있어야 한다.
exec-once = sh -c 'sleep 1; { for p in hyprbars hyprexpo; do echo "-- $p"; hyprctl plugin load /usr/lib/x86_64-linux-gnu/lib$p.so; done; echo "-- list"; hyprctl plugin list; } > "$XDG_RUNTIME_DIR/sekai-plugins.log" 2>&1'

# 플러그인 디스패처(hyprexpo:expo)를 부르는 Win+Tab 은 위 키 바인딩의 "가상 데스크톱" 묶음에 있다
#   (exec 로 hyprctl dispatch — 설정을 다시 읽어도 사라지지 않고, 설정 › 단축키 에서 바꿀 수 있다)

# ── 디버그 ──────────────────────────────────────────────
#   Hyprland 은 기본적으로 로그를 끈다. 문제가 생겼을 때
#   /run/user/1000/hypr/<instance>/hyprland.log 를 봐야 하므로 켜 둔다.
#   (tmpfs 라 재부팅하면 사라진다)
debug {
    disable_logs = false
}
