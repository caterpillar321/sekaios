# ═══════════════════════════════════════════════════════════
#  SekaiOS 1.0 (Hatsune) — Hyprland 기본 설정
#
#  이 파일은 sekai-desktop 패키지가 관리한다.
#  업데이트하면 덮어써지므로 여기를 직접 고치지 말 것.
#
#  바꾸고 싶은 건 ~/.config/hypr/hyprland.conf 에 쓰면 된다.
#  그 파일이 이 파일을 source 한 뒤에 읽히므로 거기 값이 이긴다.
#
#  문서: https://wiki.hyprland.org/
# ═══════════════════════════════════════════════════════════

$mainMod = SUPER
$term    = foot
$menu    = fuzzel

# ── 모니터 ─────────────────────────────────────────────
monitor = , preferred, auto, 1

# ── 시작 시 실행 ───────────────────────────────────────
# 세션 환경을 D-Bus 로 켜지는 서비스(파일 대화상자 포털 등)에도 알린다.
#   안 하면 그쪽은 영어로, 혹은 Wayland 를 못 찾고 뜬다.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE LANG LANGUAGE XMODIFIERS QT_IM_MODULES XDG_CONFIG_DIRS XDG_DATA_DIRS
# 한글 입력기 — ibus 를 Wayland 입력기 모드로
exec-once = ibus start --type wayland
# 바탕화면 — 배경화면과 바탕화면 아이콘을 함께 그린다 (죽으면 다시 띄운다, 로그아웃하면 멈춤)
exec-once = /usr/lib/sekai/keep-running sekai-desk
# 작업 표시줄 — 비정상 종료되면 1초 뒤 다시 띄운다 (없으면 작업 표시줄 없이 갇힌다)
exec-once = /usr/lib/sekai/keep-running sekai-panel
# 알림 데몬은 sekai-panel 이 직접 구현한다 (알림 센터가 있어야 해서).
# 외부 데몬을 띄우면 org.freedesktop.Notifications 이름을 뺏겨 버린다.
exec-once = lxpolkit
# 네트워크 트레이 아이콘 (패널이 StatusNotifier 호스트를 제공한다)
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store
# 자리 비움 — 설정의 "전원 및 잠금" 시간대로 화면 끄기·잠금·절전
exec-once = sekai-idle
# 그래픽 가속이 없어 CPU 렌더링으로 뜬 경우 (hw-env.sh 가 SEKAI_SOFTWARE_RENDER=1)
#   흐림·그림자·애니메이션을 꺼서 가볍게 하고, 드라이버를 설치하라고 알린다
exec-once = sh -c '[ -n "$SEKAI_SOFTWARE_RENDER" ] || exit 0; hyprctl --batch "keyword decoration:blur:enabled false; keyword decoration:shadow:enabled false; keyword animations:enabled false" >/dev/null; sleep 6; notify-send -a 디스플레이 -i video-display "기본 그래픽 모드로 실행 중입니다" "그래픽 가속을 쓸 수 없어 CPU 로 화면을 그리고 있습니다. 그래픽 드라이버를 설치하면 빨라집니다."'
# 설치 USB 로 켰으면 설치 화면을 띄운다 (설치된 시스템에서는 조용히 끝난다)
exec-once = sh -c 'sleep 2; command -v sekai-installer >/dev/null && sekai-installer --autostart'

# ── 환경변수 ───────────────────────────────────────────
env = XCURSOR_SIZE,24
# SekaiOS 기본 설정 계층 — /etc/xdg/sekai 를 /etc/xdg 보다 먼저 본다.
#   foot·fuzzel 은 자기 패키지가 /etc/xdg 에 설정 파일을 갖고 있어서 덮어쓸 수 없다.
#   이렇게 앞에 한 층을 두면 우리 기본값이 이기고, 사용자 ~/.config 는 여전히 그 위에서 이긴다.
env = XDG_CONFIG_DIRS,/etc/xdg/sekai:/etc/xdg
# 같은 방식으로 데이터도 한 층 — 실행기에서 숨길 .desktop 재정의 등
env = XDG_DATA_DIRS,/usr/share/sekai/data:/usr/local/share:/usr/share
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
# GPU 가속이 없는 가상머신에서 화면이 안 뜨면 아래 주석을 해제:
# env = LIBGL_ALWAYS_SOFTWARE,1

# ── 입력 ───────────────────────────────────────────────
input {
    kb_layout = us
    kb_options = korean:ralt_hangul,korean:rctrl_hanja
    follow_mouse = 2           # 윈도우처럼: 클릭해야 초점이 옮겨간다 (휠은 마우스 밑 창으로)
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── 외관 ───────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 0        # 최대화한 창이 화면에 꽉 차게 (윈도우처럼)
    border_size = 1
    # 단색 — 그라데이션/회전 효과는 과해서 뺐다. 타이틀바가 있으니 테두리는 최소로.
    col.active_border = rgba(39c5bb99)
    col.inactive_border = rgba(ffffff14)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false

    # 창을 끌 때 화면 가장자리·다른 창에 착 붙는다
    snap {
        enabled = true
        window_gap = 12
        monitor_gap = 14
    }
}

decoration {
    rounding = 10
    active_opacity = 1.0
    # 비활성 창을 반투명하게 하면 글자가 뿌옇게 보여 읽기 나쁘다
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(0000006b)
        offset = 0 6
    }
}

# ── 애니메이션 (여기가 Hyprland 를 고른 이유) ──────────
animations {
    enabled = true

    bezier = sekaiOut,  0.05, 0.9,  0.1,  1.02
    bezier = sekaiIn,   0.36, 0.0,  0.66, -0.4
    bezier = smooth,    0.25, 0.1,  0.25, 1.0

    animation = windows,     1, 4, sekaiOut, slide
    animation = windowsOut,  1, 3, sekaiIn,  popin 85%
    animation = border,      1, 6, smooth
    animation = fade,        1, 5, smooth
    animation = workspaces,  1, 4, sekaiOut, slidevert
    animation = layersIn,    1, 3, sekaiOut, popin 94%
    animation = layersOut,   1, 2, smooth,   popin 96%
    animation = fadeLayers,  1, 3, smooth
}

# ── 레이아웃 ───────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    # 기본 배경화면을 제거했으므로 반드시 꺼야 함
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # hyprland-qtutils 는 데비안에 없다. 없다는 경고만 끈다.
    disable_hyprland_qtutils_check = true
    # 잠금 화면(sekai-lock)이 죽었을 때 다시 띄워 잠금을 이어받을 수 있게
    #   (잠금은 풀리지 않는다 — 컴포지터가 화면을 잠근 채로 둔다)
    allow_session_lock_restore = true
    vfr = true
}

# ── 키 바인딩 (윈도우와 같은 자리에) ─────────────────────
#   셸 기능은 sekai-ctl 이 작업 표시줄(org.sekai.Shell)에 부탁한다.
bindr = $mainMod, SUPER_L, exec, sekai-ctl menu          # Win 키만 눌렀다 떼면 시작 메뉴
bind = $mainMod, E,      exec, thunar                    # 파일 탐색기
bind = $mainMod, Return, exec, $term
bind = $mainMod, D,      exec, $menu
bind = $mainMod, R,      exec, $menu                     # 실행
bind = $mainMod, I,      exec, sekai-settings
bind = $mainMod, N,      exec, sekai-ctl notifications   # 알림 센터
bind = $mainMod, A,      exec, sekai-ctl notifications
bind = $mainMod, V,      exec, sekai-ctl clipboard       # 클립보드 기록
bind = $mainMod, L,      exec, sekai-lock                # 잠금
bind = $mainMod, Q,      killactive,
bind = ALT, F4,          killactive,
bind = $mainMod SHIFT, M, exit,                          # 로그아웃 (실수로 누르지 않게 Shift 까지)
bind = $mainMod SHIFT, V, togglefloating,                # 이 창만 타일링 ↔ 자유 배치
bind = $mainMod, F,      fullscreen, 0
bind = , F11,            fullscreen, 0
bind = $mainMod, J,      togglesplit,

# Alt+Tab — 창 전환기. Alt 를 떼면 고른 창으로 (전환기가 직접 받는다)
bind  = ALT, Tab,        exec, sekai-ctl switch next
bind  = ALT SHIFT, Tab,  exec, sekai-ctl switch prev

# 창 배치 — Win+←/→ 반쪽, Win+↑ 최대화, Win+↓ 복원·최소화
bind = $mainMod, left,  exec, sekai-ctl snap left
bind = $mainMod, right, exec, sekai-ctl snap right
bind = $mainMod, up,    exec, sekai-ctl snap up
bind = $mainMod, down,  exec, sekai-ctl snap down

# 창을 다른 모니터로 (Win+Shift+←/→)
bind = $mainMod SHIFT, left,  movewindow, mon:l
bind = $mainMod SHIFT, right, movewindow, mon:r

# 가상 데스크톱 (워크스페이스)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod CTRL, left,  workspace, e-1
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# 마우스로 창 이동/크기조절
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# 스크린샷 — 사진/스크린샷 폴더에 저장 + 클립보드
bind = , Print,              exec, sekai-screenshot
bind = SHIFT, Print,         exec, sekai-screenshot region
bind = $mainMod SHIFT, S,    exec, sekai-screenshot region
bind = ALT, Print,           exec, sekai-screenshot window

# 음량 · 밝기 (화면에 잠깐 표시) — 누르고 있으면 반복, 잠금 화면에서도 동작
bindel = , XF86AudioRaiseVolume,  exec, sekai-ctl volume up
bindel = , XF86AudioLowerVolume,  exec, sekai-ctl volume down
bindl  = , XF86AudioMute,         exec, sekai-ctl volume mute
bindl  = , XF86AudioMicMute,      exec, sekai-ctl volume mic-mute
bindel = , XF86MonBrightnessUp,   exec, sekai-ctl brightness up
bindel = , XF86MonBrightnessDown, exec, sekai-ctl brightness down

# 미디어 — 재생 중인 플레이어(브라우저·음악 앱)에
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioStop,  exec, playerctl stop

# ── 창 배치: 윈도우 스타일 (타일링 대신 자유 배치) ─────
#   Hyprland 는 기본이 동적 타일링이라 창이 화면을 자동 분할한다.
#   float 규칙을 주면 창이 겹치고 자유롭게 움직이는 방식이 된다.
#   개별 창을 타일링으로 되돌리려면 Super+Shift+V
windowrulev2 = float, class:.*
windowrulev2 = center, floating:1
# 크기를 지정하지 않은 창의 기본 크기
windowrulev2 = size 950 620, floating:1, class:^(foot)$

# 제 제목줄(헤더바·탭 줄)을 직접 그리는 앱은 타이틀바가 두 줄이 된다 → 우리 막대를 뺀다
#   크로미움/크롬: 탭 줄에 자체 최소화·최대화·닫기가 있다 (윈도우의 크롬과 같은 모양)
#   GNOME 앱(org.gnome.*): GtkHeaderBar 를 쓴다
# ── 셸 표면 흐림 (윈도우 11 의 Mica/Acrylic 느낌) ──────────
#   sekai-panel 이 레이어마다 이름표(namespace)를 붙인다.
#   ignorealpha: 둥근 모서리 바깥의 투명 픽셀까지 흐리면 사각형 테두리가 비친다.
layerrule = blur, ^(sekai-panel|sekai-menu|sekai-popup|sekai-toast|sekai-switcher|sekai-osd|sekai-snap|launcher)$
layerrule = ignorealpha 0.4, ^(sekai-panel|sekai-menu|sekai-popup|sekai-toast|sekai-switcher|sekai-osd|launcher)$
# 끌어서 스냅 미리보기 — 부드럽게 나타나고 사라지게
layerrule = animation fade, ^(sekai-snap)$
# 위쪽 가운데로 창을 끌면 레이아웃 바가 위에서 내려온다
layerrule = animation slide top, ^(sekai-snapbar)$
layerrule = blur, ^(sekai-snapbar)$
layerrule = ignorealpha 0.4, ^(sekai-snapbar)$
layerrule = noanim, ^(sekai-catcher|sekai-desk)$

windowrulev2 = plugin:hyprbars:nobar, class:^(chromium|google-chrome.*|org\.gnome\..*)$

# 테두리를 조금 두껍게 (타이틀바가 없으므로 경계가 보이게)

# ── 타이틀바 (hyprbars 플러그인) ────────────────────────
# 플러그인 로드 권한을 명시적으로 허용
permission = /usr/lib/x86_64-linux-gnu/.*\.so, plugin, allow

# ── 색 관리(HDR) 프로토콜 끄기 ─────────────────────────
#   Hyprland 0.50 의 구현은 일부만 되어 있어, 크로미움(153)이 보내는 "직접 정한 원색" 요청을
#   프로토콜 오류로 거부하고 크로미움 연결을 끊는다 (창이 안 열림). SekaiOS 는 아직 HDR 을
#   다루지 않으므로 꺼 둔다. (Hyprland 를 다시 시작해야, 즉 다시 로그인해야 적용된다)
render {
    cm_enabled = false
}

plugin {
    hyprbars {
        # GTK 다크 테마 앱의 본문색(#2d2d2d)에 맞춘다 — 제목줄과 창 본문이 한 몸으로 보이게
        bar_height = 34
        bar_color = rgb(2c2c30)
        col.text = rgb(e6e6ea)
        bar_text_size = 10
        bar_text_font = Pretendard SemiBold
        bar_text_align = left
        bar_padding = 14
        bar_button_padding = 22
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_buttons_alignment = right
        on_double_click = hyprctl dispatch fullscreen 1

        # 창 조작 버튼(최소화·최대화·닫기)은 ~/.config/hypr/sekai.conf 에서 만든다 —
        #   색이 다크/라이트 모드를 따라야 해서 (설정 앱의 store.py write_hypr_fragment)
    }
}

# ── 작업 보기 (hyprexpo 플러그인) ───────────────────────
#   윈도우의 Win+Tab 에 해당. 워크스페이스를 격자로 펼쳐서 보여준다.
plugin {
    hyprexpo {
        columns = 3
        gap_size = 6
        bg_col = rgb(0a0e16)
        workspace_method = center current
        skip_empty = true
        enable_gesture = true
        gesture_fingers = 4
    }
}

# ── 플러그인 로드 ───────────────────────────────────────
#   주의: config 의 `plugin = ...so` 로 부팅 시 로드하면 안 된다.
#   Hyprland 는 PluginSystem 을 DecorationPositioner 보다 먼저 만들기 때문에,
#   그렇게 로드된 hyprbars 의 openWindow 훅이 DecorationPositioner 것보다
#   먼저 호출된다 → getWindowDecorationReserved() 가 std::out_of_range 를
#   던지고 Hyprland 는 이를 플러그인 크래시로 간주해 hyprbars 를 언로드한다.
#   (증상: plugin list 에는 보이는데 타이틀바가 안 나옴)
#   컴포지터가 완전히 올라온 뒤 hyprctl 로 로드하면 순서가 올바르다.
#
#   hyprexpo 의 findFunctionsByName() 은 내부적으로 `nm -D` 를 실행하므로
#   binutils 패키지가 반드시 설치돼 있어야 한다.
exec-once = sh -c 'sleep 1; { for p in hyprbars hyprexpo; do echo "-- $p"; hyprctl plugin load /usr/lib/x86_64-linux-gnu/lib$p.so; done; echo "-- list"; hyprctl plugin list; } > "$XDG_RUNTIME_DIR/sekai-plugins.log" 2>&1'

# 플러그인 디스패처는 로드 후에야 등록되므로 bind 도 그 뒤에 건다.
exec-once = sh -c 'sleep 3; hyprctl keyword bind "SUPER, Tab, hyprexpo:expo, toggle"'

# ── 디버그 ──────────────────────────────────────────────
#   Hyprland 은 기본적으로 로그를 끈다. 문제가 생겼을 때
#   /run/user/1000/hypr/<instance>/hyprland.log 를 봐야 하므로 켜 둔다.
#   (tmpfs 라 재부팅하면 사라진다)
debug {
    disable_logs = false
}
