# SekaiOS — kitty 터미널 (시스템 기본값). 윈도우 터미널과 비슷하게 쓰도록.
#   sekai-terminal 이 --config 로 읽힌다. ~/.config/kitty/kitty.conf 가 있으면 그 위에 겹친다
#   (바꾸고 싶은 줄만 거기에 쓰면 된다).
#
#   Ctrl+C          선택한 글자가 있으면 복사, 없으면 실행 중인 프로그램 멈추기
#   Ctrl+V          붙여넣기
#   Ctrl+Shift+T    새 탭          Ctrl+Shift+W    닫기 (나눈 칸 → 탭)
#   Ctrl+Tab        다음 탭        Ctrl+Shift+Tab  이전 탭
#   Ctrl+Shift+N    새 창          Ctrl + / - / 0  글자 크기
#   Alt+Shift+=     세로로 나누기   Alt+Shift+-     가로로 나누기   Alt+방향키  나눈 칸 옮겨 다니기
#   Ctrl+Shift+F    지난 출력에서 찾기 (/ 로 찾고 q 로 닫기)

# ── 글꼴 — 한글은 fontconfig 가 대신 채운다 (고정폭 칸에 맞게 나눔고딕코딩) ──
font_family      JetBrains Mono
font_size        11.0
symbol_map U+AC00-U+D7A3,U+1100-U+11FF,U+3130-U+318F NanumGothicCoding
# 기호 — 개발 도구(Claude Code 등)가 쓰는 ⎿ ⏵ ⏺ ⧉ 같은 글자는 다른 글꼴에 없어 네모로 보였다.
#   ⏺ ⏸ 은 컬러 이모지 글꼴에도 있지만 그걸로 그리면 폭이 달라 줄이 어긋난다 — 흑백 기호로
symbol_map U+23BF,U+23F4-U+23FA,U+29C9 Symbola

# ── 모양 ──
# 창 제목줄은 SekaiOS(hyprbars)가 그린다
hide_window_decorations yes
window_padding_width 6 12
background_opacity 0.97
cursor_shape beam
cursor_blink_interval 0.6
enable_audio_bell no
scrollback_lines 10000

foreground           #e4e4e8
background           #1b1b1f
selection_foreground #0f1f1e
selection_background #39c5bb
cursor               #39c5bb
cursor_text_color    #1b1b1f
url_color            #6fb3f2
color0  #2a2a30
color1  #f26d78
color2  #7fd88f
color3  #f0c66e
color4  #6fb3f2
color5  #c29df2
color6  #39c5bb
color7  #c8c8d0
color8  #5a5a64
color9  #ff8a94
color10 #9be8a8
color11 #f7d88c
color12 #8fc6ff
color13 #d6b8ff
color14 #5fd6ce
color15 #ffffff

# ── 탭 (위쪽, 탭이 둘 이상일 때) ──
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      "{index}  {title}"
tab_bar_background      #151517
active_tab_background   #39c5bb
active_tab_foreground   #0f1f1e
active_tab_font_style   bold
inactive_tab_background #2a2a30
inactive_tab_foreground #c8c8d0
inactive_tab_font_style normal

# 창·탭을 닫을 때, 셸 말고 다른 프로그램이 돌고 있으면 묻는다
confirm_os_window_close -1

# ── 단축키 (윈도우 터미널처럼) ──
map ctrl+c           copy_or_interrupt
map ctrl+v           paste_from_clipboard
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_window
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab
map ctrl+shift+n     new_os_window_with_cwd
map ctrl+alt+1       goto_tab 1
map ctrl+alt+2       goto_tab 2
map ctrl+alt+3       goto_tab 3
map ctrl+alt+4       goto_tab 4
map ctrl+alt+5       goto_tab 5
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0

# 창 나누기 (윈도우 터미널처럼)
enabled_layouts splits,stack
window_border_width 1pt
active_border_color #39c5bb
inactive_border_color #2a2a30
map alt+shift+equal  launch --location=vsplit --cwd=current
map alt+shift+plus   launch --location=vsplit --cwd=current
map alt+shift+minus  launch --location=hsplit --cwd=current
map alt+left         neighboring_window left
map alt+right        neighboring_window right
map alt+up           neighboring_window up
map alt+down         neighboring_window down

# 지난 출력에서 찾기 — 스크롤 기록을 페이저(less)로 연다
map ctrl+shift+f     show_scrollback

# 마우스 오른쪽 클릭 = 붙여넣기 (윈도우 콘솔처럼)
mouse_map right press ungrabbed paste_from_clipboard

# 업데이트 확인은 SekaiOS 가 한다
update_check_interval 0
