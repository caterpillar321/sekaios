# SekaiOS — foot 터미널 (시스템 기본값)
#   ~/.config/foot/foot.ini 를 만들면 그쪽이 이긴다.
#   한글은 NanumGothicCoding 으로 — 고정폭 칸에 맞게 그려져 줄이 어긋나지 않는다.
font=JetBrains Mono:size=11, NanumGothicCoding:size=11
pad=14x12
dpi-aware=no

[colors]
alpha=0.96
background=1b1b1f
foreground=e4e4e8
selection-background=39c5bb
selection-foreground=0f1f1e
regular0=2a2a30
regular1=f26d78
regular2=7fd88f
regular3=f0c66e
regular4=6fb3f2
regular5=c29df2
regular6=39c5bb
regular7=c8c8d0
bright0=5a5a64
bright1=ff8a94
bright2=9be8a8
bright3=f7d88c
bright4=8fc6ff
bright5=d6b8ff
bright6=5fd6ce
bright7=ffffff

[cursor]
color=1b1b1f 39c5bb
