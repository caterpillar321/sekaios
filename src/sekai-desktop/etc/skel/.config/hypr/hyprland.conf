# ═══════════════════════════════════════════════════════════
#  SekaiOS — 내 Hyprland 설정
#
#  기본값은 /usr/share/sekai/hypr/hyprland.conf 에 있고,
#  SekaiOS 를 업데이트하면 그 파일이 같이 바뀐다.
#  여기에는 "바꾸고 싶은 것만" 쓰면 된다. 나중에 읽히는 값이 이긴다.
#
#  예)
#    bind = SUPER, B, exec, chromium
#    general {
#        gaps_out = 20
#    }
# ═══════════════════════════════════════════════════════════

# SekaiOS 기본 설정
source = /usr/share/sekai/hypr/hyprland.conf

# 설정 앱(sekai-settings)이 쓰는 파일 — 직접 고치지 말 것
source = ~/.config/hypr/sekai.conf

# ── 여기부터 내 설정 ────────────────────────────────────

