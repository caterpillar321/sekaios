# SekaiOS 설치 USB 부팅 메뉴 (GRUB, 보안 부팅 가능)
#   shim(Microsoft 서명) → GRUB(데비안 서명) → 커널(데비안 서명)
#   EFI/debian/grub.cfg 가 이 파일을 불러온다 (build-iso.sh)
set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod png
set gfxmode=auto
terminal_output gfxterm
# 기본 유니코드 글꼴 — 한글이 네모로 나오지 않게 (Pretendard 를 못 읽는 경우의 대비)
#   설치본의 update-grub 처럼 이름으로 부른다 ($prefix/fonts/unicode.pf2)
loadfont unicode
loadfont pretendard-regular-22
loadfont pretendard-semibold-22
loadfont pretendard-regular-18
set theme=/boot/grub/themes/sekai/theme.txt
export theme

menuentry 'SekaiOS 사용해 보기 · 설치' --class sekaios --class os {
	linux	/live/vmlinuz boot=live components noeject quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0
	initrd	/live/initrd.img
}
menuentry 'SekaiOS (자세한 부팅 기록)' --class sekaios --class os {
	linux	/live/vmlinuz boot=live components noeject
	initrd	/live/initrd.img
}
if [ "$grub_platform" = "efi" ]; then
	fwsetup --is-supported
	if [ "$?" = 0 ]; then
		menuentry '펌웨어 설정 (UEFI)' --class efi {
			fwsetup
		}
	fi
fi
