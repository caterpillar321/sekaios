
scanfor manual
scan_driver_dirs EFI/BOOT/drivers_x64

icons_dir icons



# ── 기본: 커널/initrd 를 ESP(FAT) 에서 읽음. 드라이버 불필요 ──
timeout 3
resolution max

# 조용한 부팅: rEFInd 가 텍스트 화면으로 바꾸지 않고(파란 머리글 화면 없음) 그대로 넘긴다
use_graphics_for osx, windows, linux
hideui hints, badges

# SekaiOS 테마
banner          themes/sekai/background.png
banner_scale    fillscreen
selection_big   themes/sekai/selection_big.png
selection_small themes/sekai/selection_small.png
# rEFInd 0.14.2: 뒤쪽 칸을 없는 도구로 채워야 기본 도구가 끼어들지 않는다
showtools shutdown, reboot, firmware, gptsync, gptsync, gptsync, gptsync, gptsync, gptsync, gptsync, gptsync, gptsync

# ESP 에 복사해 둔 커널(/sekai/vmlinuz)을 '리눅스 하나 더'로 잡지 않게.
#   .efi 가 붙은 커널만 자동 탐지 → 윈도우 등 다른 OS 는 계속 잡힌다
scan_all_linux_kernels false

menuentry "SekaiOS 1.0 (Hatsune)" {
    icon   /EFI/BOOT/icons/os_sekai.png
    loader /live/vmlinuz
    initrd /live/initrd.img
    options "boot=live components quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0"

    submenuentry "Debug — live-boot verbose" {
        add_options "debug=1"
    }
    submenuentry "Safe mode (nomodeset)" {
        add_options "nomodeset noapic noacpi"
    }
    submenuentry "Serial console (ttyS0)" {
        add_options "console=tty0 console=ttyS0,115200n8 debug=1"
    }
}

# ── 진단용: ISO9660 볼륨에서 직접 읽기. 드라이버가 작동하면 이것도 부팅됨 ──
menuentry "[TEST] via ISO9660 volume" {
    icon   /EFI/BOOT/icons/os_linux.png
    volume "SEKAIOS"
    loader /live/vmlinuz
    initrd /live/initrd.img
    options "boot=live components"
}
